<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181A20" />
      <stop offset="1" stop-color="#0B0C10" />
    </linearGradient>
    
    <linearGradient id="orange-grad" x1="20" y1="100" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5500" />
      <stop offset="0.5" stop-color="#FF7700" />
      <stop offset="1" stop-color="#FFAA00" />
    </linearGradient>

    <linearGradient id="orange-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF7700" stop-opacity="0.6" />
      <stop offset="1" stop-color="#FF3300" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#bg-grad)" stroke="#2D313E" stroke-width="2" />
  
  <!-- Subtle inner border highlight -->
  <rect x="7" y="7" width="114" height="114" rx="31" stroke="url(#orange-glow)" stroke-width="1.5" />

  <!-- Dynamic Financial Flow "F" & Ascending Trend Bars -->
  <!-- Bar 1 -->
  <rect x="28" y="72" width="14" height="26" rx="7" fill="url(#orange-grad)" opacity="0.4" />
  <!-- Bar 2 -->
  <rect x="48" y="56" width="14" height="42" rx="7" fill="url(#orange-grad)" opacity="0.7" />
  <!-- Bar 3 -->
  <rect x="68" y="40" width="14" height="58" rx="7" fill="url(#orange-grad)" />

  <!-- Trend Curve with Arrow / Flare -->
  <path d="M 26 78 C 42 70, 50 54, 98 32" stroke="url(#orange-grad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 26 78 C 42 70, 50 54, 98 32" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Pulse spark at peak -->
  <circle cx="98" cy="32" r="9" fill="url(#orange-grad)" />
  <circle cx="98" cy="32" r="4" fill="#FFFFFF" />
</svg>
