services:
  - type: web
    name: finflow-api
    runtime: docker
    plan: free
    region: virginia
    branch: codex/001-finflow-mcp
    autoDeploy: false
    dockerfilePath: ./MyFinance.API/Dockerfile
    dockerContext: ./MyFinance.API
    healthCheckPath: /.well-known/oauth-protected-resource
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RunSchemaBootstrap
        value: "false"
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: McpOAuth__AllowInsecureDevelopmentTransport
        value: "false"
      - key: Mcp__RateLimitPerMinute
        value: "60"
      - key: Mcp__RateLimitBurst
        value: "10"
      - key: Mcp__DetailRateLimitPerMinute
        value: "20"
      - key: Mcp__MaxRequestBytes
        value: "262144"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AppSettings__Token
        sync: false
      - key: McpOAuth__Issuer
        sync: false
      - key: McpOAuth__ClientId
        sync: false
      - key: McpOAuth__RedirectUris__0
        sync: false
      - key: McpOAuth__EncryptionCertificateBase64
        sync: false
      - key: McpOAuth__SigningCertificateBase64
        sync: false
      - key: McpOAuth__CertificatePassword
        sync: false
